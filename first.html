<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS & JavaScript Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        footer {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My First Web Page</h1>
    </header>

    <div class="container">
        <h2>Welcome!</h2>

        <p>
            This page demonstrates HTML, CSS, and JavaScript working together.
        </p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🎉 Hello! JavaScript is working successfully.";
        }
    </script>

</body>
</html>
